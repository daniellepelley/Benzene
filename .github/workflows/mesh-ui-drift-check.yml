name: mesh-ui-drift-check

# The Mesh UI is a BUILD OUTPUT of daniellepelley/benzene-ui, vendored here as
# mesh-ui/mesh-ui.html and again as website/demos/mesh/index.html. Neither copy is hand-edited:
# changes land in benzene-ui's src/, are built, and are re-vendored.
#
# benzene-ui's own CI already proves its committed build/mesh-ui.html reproduces from source. This
# job closes the two remaining hops in the chain, which nothing else checks:
#
#   benzene-ui/build/mesh-ui.html -> mesh-ui/mesh-ui.html -> website/demos/mesh/index.html
#
# Without it, an edit made directly to a vendored copy here survives until someone notices by eye —
# and the whole point of generating the page is that nobody has to.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # weekly, catches drift introduced on the benzene-ui side
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The website demo must match the canonical copy in this repo
        run: |
          set -euo pipefail
          if ! diff -u mesh-ui/mesh-ui.html website/demos/mesh/index.html > /tmp/demo-diff.txt; then
            echo "::error file=website/demos/mesh/index.html::The website demo has drifted from mesh-ui/mesh-ui.html"
            cat /tmp/demo-diff.txt
            echo ""
            echo "Re-vendor it: cp mesh-ui/mesh-ui.html website/demos/mesh/index.html"
            exit 1
          fi
          echo "The website demo matches mesh-ui/mesh-ui.html."

      - name: Fetch the built artifact from benzene-ui
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/daniellepelley/benzene-ui.git /tmp/benzene-ui
          git -C /tmp/benzene-ui sparse-checkout set build

      - name: The canonical copy must match what benzene-ui built
        run: |
          set -euo pipefail
          built=/tmp/benzene-ui/build/mesh-ui.html
          if [ ! -f "$built" ]; then
            echo "::error::benzene-ui has no build/mesh-ui.html — has the artifact moved?"
            exit 1
          fi
          if ! diff -u "$built" mesh-ui/mesh-ui.html > /tmp/canonical-diff.txt; then
            echo "::error file=mesh-ui/mesh-ui.html::The vendored Mesh UI has drifted from the benzene-ui build"
            cat /tmp/canonical-diff.txt
            echo ""
            echo "The Mesh UI is generated. Do not edit the copy — change benzene-ui's src/, then:"
            echo "  npm run build && cp dist/index.html build/mesh-ui.html   # in benzene-ui"
            echo "  cp <benzene-ui>/build/mesh-ui.html mesh-ui/mesh-ui.html"
            echo "  cp mesh-ui/mesh-ui.html website/demos/mesh/index.html"
            exit 1
          fi
          echo "The vendored Mesh UI matches the benzene-ui build."
