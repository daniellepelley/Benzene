name: mesh-ui-drift-check

# The Mesh UI is a BUILD OUTPUT of daniellepelley/benzene-ui, vendored here as
# mesh-ui/mesh-ui.html and again as website/demos/mesh/index.html. Neither copy is hand-edited:
# changes land in benzene-ui's src/, are built, and are re-vendored.
#
# benzene-ui's own CI already proves its committed build/mesh-ui.html reproduces from source. This
# job closes the two remaining hops in the chain, which nothing else checks:
#
#   benzene-ui/build/mesh-ui.html -> mesh-ui/mesh-ui.html -> website/demos/mesh/index.html
#
# Without it, an edit made directly to a vendored copy here survives until someone notices by eye —
# and the whole point of generating the page is that nobody has to.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # weekly, catches drift introduced on the benzene-ui side
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The website demos must match the canonical copies in this repo
        run: |
          set -euo pipefail
          fail=0
          check() {
            if ! diff -u "$1" "$2" > /tmp/diff.txt; then
              echo "::error file=$2::$2 has drifted from $1"
              cat /tmp/diff.txt
              echo "Re-vendor it: cp $1 $2"
              fail=1
            fi
          }
          check mesh-ui/mesh-ui.html website/demos/mesh/index.html
          check mesh-ui/mesh-spec-ui.html website/demos/mesh/mesh-spec-ui.html
          check mesh-ui/mesh-spec-ui.html website/demos/spec/index.html
          exit $fail

      - name: Fetch the built artifact from benzene-ui
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/daniellepelley/benzene-ui.git /tmp/benzene-ui
          git -C /tmp/benzene-ui sparse-checkout set build

      - name: The canonical copies must match what benzene-ui built
        run: |
          set -euo pipefail
          fail=0
          for page in mesh-ui.html mesh-spec-ui.html; do
            built="/tmp/benzene-ui/build/$page"
            if [ ! -f "$built" ]; then
              echo "::error::benzene-ui has no build/$page — has the artifact moved?"
              fail=1; continue
            fi
            if ! diff -u "$built" "mesh-ui/$page" > /tmp/diff.txt; then
              echo "::error file=mesh-ui/$page::mesh-ui/$page has drifted from the benzene-ui build"
              cat /tmp/diff.txt
              fail=1
            fi
          done
          if [ $fail -ne 0 ]; then
            echo ""
            echo "These pages are generated. Do not edit a copy — change benzene-ui's src/, then:"
            echo "  npm run build                                            # in benzene-ui"
            echo "  cp dist/index.html build/mesh-ui.html"
            echo "  cp dist/spec/spec.html build/mesh-spec-ui.html"
            echo "  cp <benzene-ui>/build/*.html mesh-ui/"
            echo "  cp mesh-ui/mesh-ui.html website/demos/mesh/index.html"
            echo "  cp mesh-ui/mesh-spec-ui.html website/demos/mesh/mesh-spec-ui.html"
            echo "  cp mesh-ui/mesh-spec-ui.html website/demos/spec/index.html"
            exit 1
          fi
          echo "The vendored pages match the benzene-ui build."
