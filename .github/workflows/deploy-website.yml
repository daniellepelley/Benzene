name: Deploy Website (dev)

# Builds the static site and publishes it to the DEV bucket (dev.benzene.app) on every push to main
# that touches the site sources, then invalidates the dev CloudFront distribution. Promotion to
# production (benzene.app) is a separate, manual step — see promote-website.yml.
#
# Multi-source (post repo-split): the site stitches benzene's spec + each language port's docs. The
# .NET docs come from a benzene-dotnet checkout and are required; the other ports are best-effort.
#
# Each port's docs are pulled fresh on every run, so a rebuild for any reason picks up whatever each
# port has published. To get a rebuild *when a port's docs change*, that repo fires a
# repository_dispatch here: benzene-dotnet sends `dotnet-docs-updated` (see its notify-website.yml),
# and `port-docs-updated` is the generic equivalent for any other port — a port that adds a notify
# workflow starts flowing through automatically, with nothing to change in this file.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'website/**'
      - '.github/workflows/deploy-website.yml'
  repository_dispatch:
    types: [dotnet-docs-updated, port-docs-updated]
  workflow_dispatch:

jobs:
  deploy-dev:
    environment: test
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ vars.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.WEBSITE_AWS_REGION }}

    steps:
    - name: Checkout benzene
      uses: actions/checkout@v4

    # Required: the .NET docs are the reference section and the marketing/front pages link into them,
    # so the site cannot be built without this checkout (this is no longer best-effort now that the
    # .NET implementation has moved out of benzene into benzene-dotnet).
    - name: Checkout benzene-dotnet docs
      uses: actions/checkout@v4
      with:
        repository: daniellepelley/benzene-dotnet
        ref: main
        path: _sources/benzene-dotnet

    # Sibling language ports. Each is checked out at its main branch, best-effort. The generate step
    # below auto-detects each: a full docs/ tree (docs/index.md present) renders as a full docs
    # section; a port with only a README renders as a single landing page. NOTE: each repo's *main*
    # is what's used here (not necessarily its GitHub default branch), and the blob URLs point at
    # /blob/main, so keep each port's docs on main.
    - name: Checkout benzene-go (best-effort)
      continue-on-error: true
      uses: actions/checkout@v4
      with:
        repository: daniellepelley/benzene-go
        ref: main
        path: _sources/benzene-go

    - name: Checkout benzene-typescript (best-effort)
      continue-on-error: true
      uses: actions/checkout@v4
      with:
        repository: daniellepelley/benzene-typescript
        ref: main
        path: _sources/benzene-typescript

    - name: Checkout benzene-python (best-effort)
      continue-on-error: true
      uses: actions/checkout@v4
      with:
        repository: daniellepelley/benzene-python
        ref: main
        path: _sources/benzene-python

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Generate site
      run: |
        set -euo pipefail
        if [ ! -d _sources/benzene-dotnet/docs ]; then
          echo "::error::benzene-dotnet docs checkout is missing — cannot build the site."
          exit 1
        fi
        ARGS=(--out website/dist --dotnet-docs _sources/benzene-dotnet/docs)

        # Wire a sibling port: a full docs/ tree (docs/index.md) → full section; else a README → landing.
        wire_lang() {
          local id="$1" label="$2" dir="$3" blob="$4"
          if [ -f "$dir/docs/index.md" ]; then
            echo "Wiring the $label language section (full docs)."
            ARGS+=(--source "$id::$label::$id/docs::$dir/docs::$blob")
          elif [ -f "$dir/README.md" ]; then
            echo "Wiring the $label language section (landing page)."
            ARGS+=(--source "$id::$label::$id/docs::$dir::landing::$blob")
          fi
        }
        wire_lang go Go _sources/benzene-go https://github.com/daniellepelley/benzene-go/blob/main
        wire_lang typescript TypeScript _sources/benzene-typescript https://github.com/daniellepelley/benzene-typescript/blob/main
        wire_lang python Python _sources/benzene-python https://github.com/daniellepelley/benzene-python/blob/main

        dotnet run --project website/generator -- "${ARGS[@]}"

    - name: Sync to the dev bucket
      run: aws s3 sync website/dist "s3://${{ vars.WEBSITE_DEV_BUCKET }}" --delete

    - name: Invalidate the dev CloudFront distribution
      run: |
        aws cloudfront create-invalidation \
          --distribution-id "${{ vars.WEBSITE_DEV_DISTRIBUTION_ID }}" \
          --paths "/*"

    - name: Summary
      run: echo "Deployed to https://dev.benzene.app — promote with the 'Promote Website (dev -> live)' workflow." >> "$GITHUB_STEP_SUMMARY"
