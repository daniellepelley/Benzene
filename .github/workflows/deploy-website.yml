name: Deploy Website (dev)

# Builds the static site and publishes it to the DEV bucket (dev.benzene.app) on every push to main
# that touches the site sources, then invalidates the dev CloudFront distribution. Promotion to
# production (benzene.app) is a separate, manual step — see promote-website.yml.
#
# Multi-source (post repo-split): the site stitches benzene's spec + each language port's docs. The
# .NET docs come from a benzene-dotnet checkout. Until that repo exists the checkout is best-effort
# and the generator falls back to benzene's own docs/, so the site keeps building throughout the
# migration. A push to benzene-dotnet's main triggers this workflow via repository_dispatch.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'website/**'
      - '.github/workflows/deploy-website.yml'
  repository_dispatch:
    types: [dotnet-docs-updated]
  workflow_dispatch:

jobs:
  deploy-dev:
    environment: test
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ vars.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.WEBSITE_AWS_REGION }}

    steps:
    - name: Checkout benzene
      uses: actions/checkout@v4

    - name: Checkout benzene-dotnet docs (best-effort)
      continue-on-error: true
      uses: actions/checkout@v4
      with:
        repository: daniellepelley/benzene-dotnet
        ref: main
        path: _sources/benzene-dotnet

    # Sibling language ports. Each is checked out at its default branch (no ref), best-effort, and
    # wired as a language "source". Go and TypeScript are early ports with only a README so far, so
    # they render as a single landing page (=landing); when they grow a docs/ tree, point --source at
    # it and drop =landing. NOTE: keep each repo's default branch == main so the blob URLs below (used
    # for links the landing README makes to repo files) resolve.
    - name: Checkout benzene-go (best-effort)
      continue-on-error: true
      uses: actions/checkout@v4
      with:
        repository: daniellepelley/benzene-go
        path: _sources/benzene-go

    - name: Checkout benzene-typescript (best-effort)
      continue-on-error: true
      uses: actions/checkout@v4
      with:
        repository: daniellepelley/benzene-typescript
        path: _sources/benzene-typescript

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Generate site
      run: |
        set -euo pipefail
        ARGS=(--out website/dist)
        if [ -d _sources/benzene-dotnet/docs ]; then
          echo "Using .NET docs from the benzene-dotnet checkout."
          ARGS+=(--dotnet-docs _sources/benzene-dotnet/docs)
        else
          echo "benzene-dotnet not available — .NET source falls back to benzene's own docs/."
        fi
        if [ -f _sources/benzene-go/README.md ]; then
          echo "Wiring the Go language section."
          ARGS+=(--source "go::Go::go/docs::_sources/benzene-go::landing::https://github.com/daniellepelley/benzene-go/blob/main")
        fi
        if [ -f _sources/benzene-typescript/README.md ]; then
          echo "Wiring the TypeScript language section."
          ARGS+=(--source "typescript::TypeScript::typescript/docs::_sources/benzene-typescript::landing::https://github.com/daniellepelley/benzene-typescript/blob/main")
        fi
        dotnet run --project website/generator -- "${ARGS[@]}"

    - name: Sync to the dev bucket
      run: aws s3 sync website/dist "s3://${{ vars.WEBSITE_DEV_BUCKET }}" --delete

    - name: Invalidate the dev CloudFront distribution
      run: |
        aws cloudfront create-invalidation \
          --distribution-id "${{ vars.WEBSITE_DEV_DISTRIBUTION_ID }}" \
          --paths "/*"

    - name: Summary
      run: echo "Deployed to https://dev.benzene.app — promote with the 'Promote Website (dev -> live)' workflow." >> "$GITHUB_STEP_SUMMARY"
