name: Deploy Website (dev)

# Builds the static site and publishes it to the DEV bucket (dev.benzene.app) on every push to main
# that touches the site sources, then invalidates the dev CloudFront distribution. Promotion to
# production (benzene.app) is a separate, manual step — see promote-website.yml.
#
# Multi-source (post repo-split): the site stitches benzene's spec + each language port's docs. The
# .NET docs come from a benzene-dotnet checkout. Until that repo exists the checkout is best-effort
# and the generator falls back to benzene's own docs/, so the site keeps building throughout the
# migration. A push to benzene-dotnet's main triggers this workflow via repository_dispatch.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'website/**'
      - '.github/workflows/deploy-website.yml'
  repository_dispatch:
    types: [dotnet-docs-updated]
  workflow_dispatch:

jobs:
  deploy-dev:
    environment: test
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ vars.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.WEBSITE_AWS_REGION }}

    steps:
    - name: Checkout benzene
      uses: actions/checkout@v4

    - name: Checkout benzene-dotnet docs (best-effort until the repo exists)
      continue-on-error: true
      uses: actions/checkout@v4
      with:
        repository: daniellepelley/benzene-dotnet
        ref: main
        path: _sources/benzene-dotnet

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Generate site
      run: |
        if [ -d _sources/benzene-dotnet/docs ]; then
          echo "Using .NET docs from the benzene-dotnet checkout."
          dotnet run --project website/generator -- --out website/dist \
            --dotnet-docs _sources/benzene-dotnet/docs
        else
          echo "benzene-dotnet not available yet — falling back to benzene's own docs/ for the .NET source."
          dotnet run --project website/generator -- --out website/dist
        fi

    - name: Sync to the dev bucket
      run: aws s3 sync website/dist "s3://${{ vars.WEBSITE_DEV_BUCKET }}" --delete

    - name: Invalidate the dev CloudFront distribution
      run: |
        aws cloudfront create-invalidation \
          --distribution-id "${{ vars.WEBSITE_DEV_DISTRIBUTION_ID }}" \
          --paths "/*"

    - name: Summary
      run: echo "Deployed to https://dev.benzene.app — promote with the 'Promote Website (dev -> live)' workflow." >> "$GITHUB_STEP_SUMMARY"
