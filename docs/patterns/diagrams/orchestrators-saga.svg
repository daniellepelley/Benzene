<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 370" role="img" aria-label="Saga pattern: stage 1 runs Create Tenant and Create Okta Company concurrently, then stage 2 runs Create User; on any failure, every completed step is compensated in reverse order - Delete User, then Delete Okta Company and Delete Tenant.">
<style>
  .dp-line { stroke: #c7c7c7; stroke-width: 2; fill: none; }
  .dp-line-dashed { stroke: #c7c7c7; stroke-width: 2; fill: none; stroke-dasharray: 5 4; }
  .dp-arrow { fill: #8a8a8a; }
  .dp-box { fill: #ffffff; stroke: #d8d8d8; stroke-width: 2; }
  .dp-box-label { fill: #1a1a1a; font: 700 13px sans-serif; }
  .dp-box-sublabel { fill: #5a5a5a; font: 11px sans-serif; }
  .dp-box-tag { fill: #2f6f4e; font: 700 10px sans-serif; text-transform: uppercase; letter-spacing: 0.03em; }
  .dp-db { fill: #f6f8f7; stroke: #d8d8d8; stroke-width: 2; }
  .dp-db-label { fill: #5a5a5a; font: 700 11px sans-serif; }
  .dp-accent { fill: rgba(47,111,78,0.09); stroke: #2f6f4e; stroke-width: 2.5; }
  .dp-accent-label { fill: #1a1a1a; font: 700 15px sans-serif; }
  .dp-accent-sublabel { fill: #4a4a4a; font: 12px sans-serif; }
  .dp-outer { fill: none; stroke: #d8d8d8; stroke-width: 2; stroke-dasharray: 6 4; }
  .dp-outer-label { fill: #5a5a5a; font: 700 12px sans-serif; text-transform: uppercase; letter-spacing: 0.04em; }
  .dp-caption { fill: #5a5a5a; font: 12px sans-serif; }
  .dp-caption-strong { fill: #1a1a1a; font: 700 13px sans-serif; }
  .dp-edge-label { fill: #4a4a4a; font: 11px sans-serif; }
  .dp-label-bg { fill: #ffffff; }
  @media (prefers-color-scheme: dark) {
    .dp-line { stroke: #4a4e55; }
    .dp-line-dashed { stroke: #4a4e55; }
    .dp-arrow { fill: #8f959d; }
    .dp-box { fill: #1c1f23; stroke: #3a3d42; }
    .dp-box-label { fill: #e8e8e8; }
    .dp-box-sublabel { fill: #a3a3a3; }
    .dp-box-tag { fill: #6fcf9a; }
    .dp-db { fill: #1c1f23; stroke: #3a3d42; }
    .dp-db-label { fill: #a3a3a3; }
    .dp-accent { fill: rgba(111,207,154,0.12); stroke: #6fcf9a; }
    .dp-accent-label { fill: #e8e8e8; }
    .dp-accent-sublabel { fill: #c2c2c2; }
    .dp-outer { stroke: #3a3d42; }
    .dp-outer-label { fill: #a3a3a3; }
    .dp-caption { fill: #a3a3a3; }
    .dp-caption-strong { fill: #e8e8e8; }
    .dp-edge-label { fill: #c2c2c2; }
    .dp-label-bg { fill: #14161a; }
  }
</style>
<text x="40" y="34" text-anchor="start" class="dp-outer-label">FORWARD</text>
<rect x="140" y="20" width="190" height="64" rx="8" class="dp-box"/>
<text x="235" y="47" text-anchor="middle" class="dp-box-label">Create Tenant</text>
<text x="235" y="67" text-anchor="middle" class="dp-box-sublabel">stage 1</text>
<rect x="140" y="110" width="190" height="64" rx="8" class="dp-box"/>
<text x="235" y="137" text-anchor="middle" class="dp-box-label">Create Okta Company</text>
<text x="235" y="157" text-anchor="middle" class="dp-box-sublabel">stage 1 (concurrent)</text>
<rect x="500" y="65" width="190" height="64" rx="8" class="dp-accent"/>
<text x="595" y="92" text-anchor="middle" class="dp-accent-label">Create User</text>
<text x="595" y="112" text-anchor="middle" class="dp-accent-sublabel">stage 2 (reads stage 1)</text>
<polyline points="334,52 374,52 374,97 496,97" class="dp-line"/>
<polyline points="334,142 374,142 374,97 496,97" class="dp-line"/>
<polygon points="492,91 492,103 500,97" class="dp-arrow"/>
<text x="40" y="234" text-anchor="start" class="dp-outer-label">COMPENSATE (on failure, LIFO)</text>
<rect x="140" y="260" width="190" height="64" rx="8" class="dp-box"/>
<text x="235" y="290" text-anchor="middle" class="dp-box-label">Delete Tenant</text>
<text x="235" y="310" text-anchor="middle" class="dp-box-sublabel">idempotent</text>
<rect x="360" y="260" width="190" height="64" rx="8" class="dp-box"/>
<text x="455" y="290" text-anchor="middle" class="dp-box-label">Delete Okta Company</text>
<text x="455" y="310" text-anchor="middle" class="dp-box-sublabel">idempotent</text>
<rect x="580" y="260" width="190" height="64" rx="8" class="dp-box"/>
<text x="675" y="290" text-anchor="middle" class="dp-box-label">Delete User</text>
<text x="675" y="310" text-anchor="middle" class="dp-box-sublabel">idempotent</text>
<line x1="576" y1="292" x2="554" y2="292" class="dp-line-dashed"/>
<polygon points="558,286 558,298 550,292" class="dp-arrow"/>
<line x1="356" y1="292" x2="334" y2="292" class="dp-line-dashed"/>
<polygon points="338,286 338,298 330,292" class="dp-arrow"/>
<text x="470" y="359" text-anchor="middle" class="dp-caption">A PartiallyRolledBack outcome &#8212; a compensation itself failing &#8212; is never retried automatically; it is surfaced for a human.</text>
</svg>