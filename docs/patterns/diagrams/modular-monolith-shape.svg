<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" role="img" aria-label="Modular monolith: one process containing Orders, Billing, and Shipping modules, each with its own handlers, pipeline, and data, addressing each other only by topic through the in-process routing table.">
<style>
  .dp-line { stroke: #c7c7c7; stroke-width: 2; fill: none; }
  .dp-line-dashed { stroke: #c7c7c7; stroke-width: 2; fill: none; stroke-dasharray: 5 4; }
  .dp-arrow { fill: #8a8a8a; }
  .dp-box { fill: #ffffff; stroke: #d8d8d8; stroke-width: 2; }
  .dp-box-label { fill: #1a1a1a; font: 700 13px sans-serif; }
  .dp-box-sublabel { fill: #5a5a5a; font: 11px sans-serif; }
  .dp-box-tag { fill: #2f6f4e; font: 700 10px sans-serif; text-transform: uppercase; letter-spacing: 0.03em; }
  .dp-db { fill: #f6f8f7; stroke: #d8d8d8; stroke-width: 2; }
  .dp-db-label { fill: #5a5a5a; font: 700 11px sans-serif; }
  .dp-accent { fill: rgba(47,111,78,0.09); stroke: #2f6f4e; stroke-width: 2.5; }
  .dp-accent-label { fill: #1a1a1a; font: 700 15px sans-serif; }
  .dp-accent-sublabel { fill: #4a4a4a; font: 12px sans-serif; }
  .dp-outer { fill: none; stroke: #d8d8d8; stroke-width: 2; stroke-dasharray: 6 4; }
  .dp-outer-label { fill: #5a5a5a; font: 700 12px sans-serif; text-transform: uppercase; letter-spacing: 0.04em; }
  .dp-caption { fill: #5a5a5a; font: 12px sans-serif; }
  .dp-caption-strong { fill: #1a1a1a; font: 700 13px sans-serif; }
  .dp-edge-label { fill: #4a4a4a; font: 11px sans-serif; }
  .dp-label-bg { fill: #ffffff; }
  @media (prefers-color-scheme: dark) {
    .dp-line { stroke: #4a4e55; }
    .dp-line-dashed { stroke: #4a4e55; }
    .dp-arrow { fill: #8f959d; }
    .dp-box { fill: #1c1f23; stroke: #3a3d42; }
    .dp-box-label { fill: #e8e8e8; }
    .dp-box-sublabel { fill: #a3a3a3; }
    .dp-box-tag { fill: #6fcf9a; }
    .dp-db { fill: #1c1f23; stroke: #3a3d42; }
    .dp-db-label { fill: #a3a3a3; }
    .dp-accent { fill: rgba(111,207,154,0.12); stroke: #6fcf9a; }
    .dp-accent-label { fill: #e8e8e8; }
    .dp-accent-sublabel { fill: #c2c2c2; }
    .dp-outer { stroke: #3a3d42; }
    .dp-outer-label { fill: #a3a3a3; }
    .dp-caption { fill: #a3a3a3; }
    .dp-caption-strong { fill: #e8e8e8; }
    .dp-edge-label { fill: #c2c2c2; }
    .dp-label-bg { fill: #14161a; }
  }
</style>
<rect x="40" y="20" width="800" height="280" rx="12" class="dp-outer"/>
<text x="56" y="46" text-anchor="start" class="dp-outer-label">ONE PROCESS</text>
<line x1="0" y1="110" x2="36" y2="110" class="dp-line"/>
<polygon points="28,104 28,116 36,110" class="dp-arrow"/>
<text x="4" y="102" text-anchor="start" class="dp-caption-strong">HTTP</text>
<line x1="0" y1="170" x2="36" y2="170" class="dp-line"/>
<polygon points="28,164 28,176 36,170" class="dp-arrow"/>
<text x="4" y="162" text-anchor="start" class="dp-caption-strong">queue</text>
<rect x="110" y="75" width="190" height="130" rx="8" class="dp-box"/>
<text x="205" y="103" text-anchor="middle" class="dp-box-label">ORDERS</text>
<text x="205" y="125" text-anchor="middle" class="dp-box-sublabel">handlers</text>
<text x="205" y="141" text-anchor="middle" class="dp-box-sublabel">pipeline</text>
<text x="205" y="157" text-anchor="middle" class="dp-box-sublabel">own data</text>
<rect x="345" y="75" width="190" height="130" rx="8" class="dp-box"/>
<text x="440" y="103" text-anchor="middle" class="dp-box-label">BILLING</text>
<text x="440" y="125" text-anchor="middle" class="dp-box-sublabel">handlers</text>
<text x="440" y="141" text-anchor="middle" class="dp-box-sublabel">pipeline</text>
<text x="440" y="157" text-anchor="middle" class="dp-box-sublabel">own data</text>
<rect x="580" y="75" width="190" height="130" rx="8" class="dp-box"/>
<text x="675" y="103" text-anchor="middle" class="dp-box-label">SHIPPING</text>
<text x="675" y="125" text-anchor="middle" class="dp-box-sublabel">handlers</text>
<text x="675" y="141" text-anchor="middle" class="dp-box-sublabel">pipeline</text>
<text x="675" y="157" text-anchor="middle" class="dp-box-sublabel">own data</text>
<line x1="205" y1="209" x2="205" y2="239" class="dp-line"/>
<line x1="205" y1="239" x2="675" y2="239" class="dp-line"/>
<line x1="440" y1="239" x2="440" y2="209" class="dp-line"/>
<polygon points="434,217 446,217 440,209" class="dp-arrow"/>
<line x1="675" y1="239" x2="675" y2="209" class="dp-line"/>
<polygon points="669,217 681,217 675,209" class="dp-arrow"/>
<rect x="245.95" y="216" width="388.1" height="26" rx="4" class="dp-label-bg"/>
<text x="440" y="233" text-anchor="middle" class="dp-edge-label">send("billing:charge", &#8230;) &#8212; via the routing table</text>
<text x="440" y="275" text-anchor="middle" class="dp-caption">routes resolve in process &#8212; for now</text>
</svg>