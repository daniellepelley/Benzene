<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 190" role="img" aria-label="Transactional outbox, shape 1: a core service writes its row in one transaction, DynamoDB Streams captures the change, and a relay publishes the event.">
<style>
  .dp-line { stroke: #c7c7c7; stroke-width: 2; fill: none; }
  .dp-line-dashed { stroke: #c7c7c7; stroke-width: 2; fill: none; stroke-dasharray: 5 4; }
  .dp-arrow { fill: #8a8a8a; }
  .dp-box { fill: #ffffff; stroke: #d8d8d8; stroke-width: 2; }
  .dp-box-label { fill: #1a1a1a; font: 700 13px sans-serif; }
  .dp-box-sublabel { fill: #5a5a5a; font: 11px sans-serif; }
  .dp-box-tag { fill: #2f6f4e; font: 700 10px sans-serif; text-transform: uppercase; letter-spacing: 0.03em; }
  .dp-db { fill: #f6f8f7; stroke: #d8d8d8; stroke-width: 2; }
  .dp-db-label { fill: #5a5a5a; font: 700 11px sans-serif; }
  .dp-accent { fill: rgba(47,111,78,0.09); stroke: #2f6f4e; stroke-width: 2.5; }
  .dp-accent-label { fill: #1a1a1a; font: 700 15px sans-serif; }
  .dp-accent-sublabel { fill: #4a4a4a; font: 12px sans-serif; }
  .dp-outer { fill: none; stroke: #d8d8d8; stroke-width: 2; stroke-dasharray: 6 4; }
  .dp-outer-label { fill: #5a5a5a; font: 700 12px sans-serif; text-transform: uppercase; letter-spacing: 0.04em; }
  .dp-caption { fill: #5a5a5a; font: 12px sans-serif; }
  .dp-caption-strong { fill: #1a1a1a; font: 700 13px sans-serif; }
  .dp-edge-label { fill: #4a4a4a; font: 11px sans-serif; }
  .dp-label-bg { fill: #ffffff; }
  @media (prefers-color-scheme: dark) {
    .dp-line { stroke: #4a4e55; }
    .dp-line-dashed { stroke: #4a4e55; }
    .dp-arrow { fill: #8f959d; }
    .dp-box { fill: #1c1f23; stroke: #3a3d42; }
    .dp-box-label { fill: #e8e8e8; }
    .dp-box-sublabel { fill: #a3a3a3; }
    .dp-box-tag { fill: #6fcf9a; }
    .dp-db { fill: #1c1f23; stroke: #3a3d42; }
    .dp-db-label { fill: #a3a3a3; }
    .dp-accent { fill: rgba(111,207,154,0.12); stroke: #6fcf9a; }
    .dp-accent-label { fill: #e8e8e8; }
    .dp-accent-sublabel { fill: #c2c2c2; }
    .dp-outer { stroke: #3a3d42; }
    .dp-outer-label { fill: #a3a3a3; }
    .dp-caption { fill: #a3a3a3; }
    .dp-caption-strong { fill: #e8e8e8; }
    .dp-edge-label { fill: #c2c2c2; }
    .dp-label-bg { fill: #14161a; }
  }
</style>
<rect x="19" y="60" width="210" height="78" rx="8" class="dp-box"/>
<text x="124" y="92" text-anchor="middle" class="dp-box-label">Core service</text>
<text x="124" y="112" text-anchor="middle" class="dp-box-sublabel">one transaction: write the row</text>
<line x1="233" y1="99" x2="259" y2="99" class="dp-line"/>
<polygon points="251,93 251,105 259,99" class="dp-arrow"/>
<rect x="263" y="60" width="210" height="78" rx="8" class="dp-box"/>
<text x="368" y="92" text-anchor="middle" class="dp-box-label">DynamoDB table</text>
<text x="368" y="112" text-anchor="middle" class="dp-box-sublabel">orders row committed</text>
<line x1="477" y1="99" x2="503" y2="99" class="dp-line"/>
<polygon points="495,93 495,105 503,99" class="dp-arrow"/>
<rect x="507" y="60" width="210" height="78" rx="8" class="dp-accent"/>
<text x="612" y="92" text-anchor="middle" class="dp-accent-label">DynamoDB Streams</text>
<text x="612" y="112" text-anchor="middle" class="dp-accent-sublabel">change-data capture</text>
<line x1="721" y1="99" x2="747" y2="99" class="dp-line"/>
<polygon points="739,93 739,105 747,99" class="dp-arrow"/>
<rect x="751" y="60" width="210" height="78" rx="8" class="dp-box"/>
<text x="856" y="92" text-anchor="middle" class="dp-box-label">Relay</text>
<text x="856" y="112" text-anchor="middle" class="dp-box-sublabel">publishes order:created</text>
<text x="490" y="172" text-anchor="middle" class="dp-caption">The change is the trigger &#8212; no window where the write exists but the event might not.</text>
<text x="490" y="188" text-anchor="middle" class="dp-caption">From the relay's publish onward, this is just choreography: downstream services subscribe and never know it came from a stream.</text>
</svg>