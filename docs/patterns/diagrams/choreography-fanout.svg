<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" role="img" aria-label="Event-driven choreography: a signup service emits tenant:created, and three independent reactions - welcome email, cache warm, and trial clock - each subscribe and react on their own, with no central conductor.">
<style>
  .dp-line { stroke: #c7c7c7; stroke-width: 2; fill: none; }
  .dp-line-dashed { stroke: #c7c7c7; stroke-width: 2; fill: none; stroke-dasharray: 5 4; }
  .dp-arrow { fill: #8a8a8a; }
  .dp-box { fill: #ffffff; stroke: #d8d8d8; stroke-width: 2; }
  .dp-box-label { fill: #1a1a1a; font: 700 13px sans-serif; }
  .dp-box-sublabel { fill: #5a5a5a; font: 11px sans-serif; }
  .dp-box-tag { fill: #2f6f4e; font: 700 10px sans-serif; text-transform: uppercase; letter-spacing: 0.03em; }
  .dp-db { fill: #f6f8f7; stroke: #d8d8d8; stroke-width: 2; }
  .dp-db-label { fill: #5a5a5a; font: 700 11px sans-serif; }
  .dp-accent { fill: rgba(47,111,78,0.09); stroke: #2f6f4e; stroke-width: 2.5; }
  .dp-accent-label { fill: #1a1a1a; font: 700 15px sans-serif; }
  .dp-accent-sublabel { fill: #4a4a4a; font: 12px sans-serif; }
  .dp-outer { fill: none; stroke: #d8d8d8; stroke-width: 2; stroke-dasharray: 6 4; }
  .dp-outer-label { fill: #5a5a5a; font: 700 12px sans-serif; text-transform: uppercase; letter-spacing: 0.04em; }
  .dp-caption { fill: #5a5a5a; font: 12px sans-serif; }
  .dp-caption-strong { fill: #1a1a1a; font: 700 13px sans-serif; }
  .dp-edge-label { fill: #4a4a4a; font: 11px sans-serif; }
  .dp-label-bg { fill: #ffffff; }
  @media (prefers-color-scheme: dark) {
    .dp-line { stroke: #4a4e55; }
    .dp-line-dashed { stroke: #4a4e55; }
    .dp-arrow { fill: #8f959d; }
    .dp-box { fill: #1c1f23; stroke: #3a3d42; }
    .dp-box-label { fill: #e8e8e8; }
    .dp-box-sublabel { fill: #a3a3a3; }
    .dp-box-tag { fill: #6fcf9a; }
    .dp-db { fill: #1c1f23; stroke: #3a3d42; }
    .dp-db-label { fill: #a3a3a3; }
    .dp-accent { fill: rgba(111,207,154,0.12); stroke: #6fcf9a; }
    .dp-accent-label { fill: #e8e8e8; }
    .dp-accent-sublabel { fill: #c2c2c2; }
    .dp-outer { stroke: #3a3d42; }
    .dp-outer-label { fill: #a3a3a3; }
    .dp-caption { fill: #a3a3a3; }
    .dp-caption-strong { fill: #e8e8e8; }
    .dp-edge-label { fill: #c2c2c2; }
    .dp-label-bg { fill: #14161a; }
  }
</style>
<rect x="40" y="111" width="190" height="78" rx="8" class="dp-box"/>
<text x="135" y="143" text-anchor="middle" class="dp-box-label">Signup Service</text>
<text x="135" y="163" text-anchor="middle" class="dp-box-sublabel">the emitter</text>
<rect x="360" y="111" width="180" height="78" rx="8" class="dp-accent"/>
<text x="450" y="141" text-anchor="middle" class="dp-accent-label">tenant:created</text>
<text x="450" y="161" text-anchor="middle" class="dp-accent-sublabel">fire-and-forget</text>
<line x1="234" y1="150" x2="356" y2="150" class="dp-line"/>
<polygon points="348,144 348,156 356,150" class="dp-arrow"/>
<rect x="700" y="30" width="200" height="78" rx="8" class="dp-box"/>
<text x="800" y="62" text-anchor="middle" class="dp-box-label">Welcome Email</text>
<text x="800" y="82" text-anchor="middle" class="dp-box-sublabel">send it</text>
<polyline points="544,150 580,150 580,69 696,69" class="dp-line"/>
<polygon points="692,63 692,75 700,69" class="dp-arrow"/>
<rect x="700" y="130" width="200" height="78" rx="8" class="dp-box"/>
<text x="800" y="162" text-anchor="middle" class="dp-box-label">Warm Cache</text>
<text x="800" y="182" text-anchor="middle" class="dp-box-sublabel">prime it</text>
<polyline points="544,150 580,150 580,169 696,169" class="dp-line"/>
<polygon points="692,163 692,175 700,169" class="dp-arrow"/>
<rect x="700" y="230" width="200" height="78" rx="8" class="dp-box"/>
<text x="800" y="262" text-anchor="middle" class="dp-box-label">Trial Clock</text>
<text x="800" y="282" text-anchor="middle" class="dp-box-sublabel">start it</text>
<polyline points="544,150 580,150 580,269 696,269" class="dp-line"/>
<polygon points="692,263 692,275 700,269" class="dp-arrow"/>
<text x="470" y="280" text-anchor="middle" class="dp-caption">No reaction knows about the others; add a fourth by subscribing &#8212; no existing service changes.</text>
</svg>