name: Notify website

# Ships in benzene-dotnet. On a push to main that touches the .NET docs, fire a repository_dispatch
# at the benzene repo so its Deploy Website workflow rebuilds dev.benzene.app with the fresh .NET
# docs. Requires a repo secret WEBSITE_DISPATCH_TOKEN: a PAT (or fine-grained token) with
# "contents: read" + "actions: write" (repository_dispatch) on daniellepelley/Benzene. If the secret
# is absent the step is skipped, so this never hard-fails a docs push.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch website rebuild
        if: ${{ secrets.WEBSITE_DISPATCH_TOKEN != '' }}
        run: |
          curl -sSf -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.WEBSITE_DISPATCH_TOKEN }}" \
            https://api.github.com/repos/daniellepelley/Benzene/dispatches \
            -d '{"event_type":"dotnet-docs-updated"}'
